name: ${SERVICE_NAME}

# Network architecture:
#
#   [internet] ←──→ [tailscale] ←──→ [app network] ←──→ [web]
#                       ↑
#                    [egress network]
#
# The 'app' network uses internal:true, meaning Docker provides no default
# internet gateway. The web container can only receive traffic forwarded by
# Tailscale and cannot make direct outbound internet connections.
#
# The 'egress' network is a regular bridge that gives the tailscale container
# internet access for the coordination server and WireGuard VPN tunnel.

networks:
  # Isolated internal network. Containers here cannot route to the internet
  # directly. All external connectivity is mediated by the tailscale container.
  app:
    internal: true

  # Internet-facing network. Only the tailscale container joins this, so it
  # can reach login.tailscale.com and maintain the WireGuard tunnel.
  egress:

volumes:
  caddy_data:
  ts-lib-var:

services:

  # ─── Your service ──────────────────────────────────────────────────────────
  # Replace this with whatever you want to expose over Tailscale.
  # Requirements:
  #   - service name must be "web" (referenced in tsconfig/serve.json)
  #   - must listen on port 8080 inside the container (or update serve.json)
  #   - do NOT add a 'ports:' mapping — all inbound traffic comes via Tailscale
  #
  # ── Outbound internet access (whitelisting) ────────────────────────────────
  # By default the web container is on an internal Docker network with no
  # internet gateway. To allow specific outbound connections, route them
  # through Tailscale's SOCKS5 or HTTP proxy (enabled in the tailscale
  # service below via TS_EXTRA_ARGS). Destination whitelisting is enforced
  # by your Tailscale ACL policy — see https://tailscale.com/kb/1018/acls
  #
  # Uncomment and configure the proxy env vars below for your use case:
  #
  #   ALL_PROXY=socks5://tailscale:1080
  #     Routes all outbound TCP through the SOCKS5 proxy. Most HTTP clients
  #     (curl, python-requests, Go net/http) respect this automatically.
  #
  #   HTTP_PROXY=http://tailscale:8118
  #   HTTPS_PROXY=http://tailscale:8118
  #     Routes HTTP/HTTPS only; use when ALL_PROXY causes issues (e.g. gRPC).
  #
  #   NO_PROXY=localhost,127.0.0.1,tailscale
  #     Bypass the proxy for loopback and the Tailscale sidecar itself.
  #
  # To restrict which destinations are reachable, add an ACL rule in the
  # Tailscale admin console that allows only the specific IPs or hostnames
  # your service needs to contact. All other outbound traffic is blocked
  # by the ACL deny-by-default policy.
  web:
    image: caddy:2
    container_name: caddy-server
    command: caddy file-server --browse --root /usr/share/caddy --listen :8080
    volumes:
      - ./www/:/usr/share/caddy/:ro
      - caddy_data:/data
    environment:
      # Uncomment to allow outbound connections via Tailscale's proxy.
      # Requires --socks5-server / --outbound-http-proxy-listen in TS_EXTRA_ARGS.
      # - ALL_PROXY=socks5://tailscale:1080
      # - HTTP_PROXY=http://tailscale:8118
      # - HTTPS_PROXY=http://tailscale:8118
      # - NO_PROXY=localhost,127.0.0.1,tailscale
    networks:
      - app              # internal only — no direct internet access
    depends_on:
      - tailscale
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true    # block setuid/setgid privilege escalation
    cap_drop:
      - ALL               # drop all Linux capabilities
    cap_add:
      - NET_BIND_SERVICE  # allow binding ports < 1024 if needed by your service

  # ─── Tailscale ─────────────────────────────────────────────────────────────
  # Acts as the secure gateway. Receives inbound traffic from your tailnet
  # and forwards it to the web service. Also the only container with a route
  # to the internet (via the 'egress' network).
  tailscale:
    image: tailscale/tailscale:stable
    hostname: ${SERVICE_NAME}
    environment:
      # Path to the serve config inside the container.
      # See tsconfig/serve.json (working config) and
      #     tsconfig/serve.example.jsonc (annotated reference).
      - TS_SERVE_CONFIG=/etc/tailscale/config/serve.json

      # Auth key from https://login.tailscale.com/admin/settings/keys
      # Recommendation: use an ephemeral, pre-approved key with an ACL tag.
      - TS_AUTHKEY=${TS_AUTHKEY}

      # Extra CLI flags passed to 'tailscale up'.
      # --reset            clears stale serve config left from a previous run.
      #
      # To enable outbound proxy support (for the web container whitelist):
      # --socks5-server=0.0.0.0:1080
      #   Starts a SOCKS5 proxy bound to all interfaces. The web container
      #   can use ALL_PROXY=socks5://tailscale:1080 to route outbound TCP
      #   through Tailscale. Destinations are filtered by Tailscale ACLs.
      # --outbound-http-proxy-listen=0.0.0.0:8118
      #   Starts an HTTP CONNECT proxy. Use HTTP_PROXY / HTTPS_PROXY in
      #   the web container. Can be used alongside or instead of SOCKS5.
      #
      # Example with both proxies enabled:
      #   TS_EXTRA_ARGS=--reset --socks5-server=0.0.0.0:1080 --outbound-http-proxy-listen=0.0.0.0:8118
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:---reset}

      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - ./tsconfig/:/etc/tailscale/config/:ro
      - ts-lib-var:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin    # required to configure the WireGuard tunnel interface
      - sys_module   # required to load kernel modules (wireguard)
    networks:
      - app          # reaches the web service by hostname "web"
      - egress       # reaches the Tailscale coordination server
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # ─── Falco (optional) ──────────────────────────────────────────────────────
  # Runtime security monitor using eBPF. Detects anomalous kernel activity:
  #   • unexpected shell or binary execution inside containers
  #   • suspicious outbound network connections
  #   • writes to protected filesystem paths
  #   • privilege escalation attempts
  #
  # Falco operates at the syscall level, so it alerts on the *effects* of
  # unusual code paths — for example, a web server spawning a shell suggests
  # RCE even when you don't have the source. For deeper binary-level tracing
  # (e.g. alerting when a specific C function is called) see Cilium Tetragon
  # (https://tetragon.io), which uses eBPF uprobes.
  #
  # Requires: Linux kernel ≥ 5.8 (for the eBPF probe used by falco-no-driver).
  # For older kernels use 'falcosecurity/falco' with the kernel module driver.
  #
  # Trade-off: privileged mode is needed for kernel eBPF access. This gives
  # Falco broad visibility but increases its own attack surface.
  #
  # To disable monitoring, comment out this entire service.
  falco:
    image: falcosecurity/falco-no-driver:latest
    container_name: falco
    privileged: true          # required for eBPF kernel probe
    pid: host                 # required to correlate kernel events to processes
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /boot:/host/boot:ro
      - /lib/modules:/host/lib/modules:ro
      - /usr:/host/usr:ro
      - /etc:/host/etc:ro
      - ./falco/rules.d/:/etc/falco/rules.d/:ro
    environment:
      # Use the modern eBPF driver — no kernel module installation required.
      - FALCO_BPF_PROBE=
    networks:
      - app
    restart: unless-stopped
